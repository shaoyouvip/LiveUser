services:
  liveuser:
    image: ghcr.io/shaoyouvip/liveuser:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:10086:10086"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
